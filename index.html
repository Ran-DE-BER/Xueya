<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">

<title>血压记录</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

  margin: 0;
  padding: 20px;

  min-height: 100vh;

  background: linear-gradient(
    180deg,
    #4a4a4c 0%,
    #2f2f31 25%,
    #1c1c1e 60%,
    #000000 100%
  );

  color: white;
}

.container {
  max-width: 500px;
  margin: auto;
}

h2 {
  text-align: center;
  margin-top: 4px;
  margin-bottom: 18px;

  font-size: 24px;
  font-weight: 700;
}

.card {
  background: rgba(255,255,255,0.08);

  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);

  border: 1px solid rgba(255,255,255,0.08);

  border-radius: 20px;

  padding: 16px;

  margin-bottom: 15px;
}


/* ==========================
   通用输入框
========================== */

input {
  border: none;
  outline: none;

  color: white;

  font-family: inherit;
}


/* ==========================
   日期区域
========================== */

.date-area {
  display: flex;

  justify-content: center;

  align-items: center;

  margin-bottom: 14px;
}


/*
  日期输入框

  想改宽度主要修改这里：
  width: 145px;

  想改高度修改：
  height: 38px;
*/

#date {
  width: 145px;

  height: 38px;

  padding: 0 12px;

  margin: 0;

  border-radius: 12px;

  background: rgba(255,255,255,0.09);

  border: 1px solid rgba(255,255,255,0.05);

  color: rgba(255,255,255,0.88);

  font-size: 14px;

  font-weight: 500;

  text-align: center;

  text-align-last: center;

  cursor: pointer;

  appearance: none;

  -webkit-appearance: none;
}


/* 日期选择图标 */

#date::-webkit-calendar-picker-indicator {
  filter: invert(1);

  opacity: 0.45;

  cursor: pointer;

  margin-left: 3px;
}


/* 鼠标放上去 */

#date:hover {
  background: rgba(255,255,255,0.13);
}


/* 点击日期框 */

#date:focus {
  background: rgba(255,255,255,0.15);

  border:
    1px solid rgba(10,132,255,0.45);
}


/* ==========================
   SYS / DIA 区域
========================== */

.bp-inputs {
  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 12px;
}

.bp-box {
  text-align: center;

  background: rgba(255,255,255,0.055);

  border-radius: 17px;

  padding: 12px 11px 13px 11px;

  border: 1px solid rgba(255,255,255,0.04);
}

.bp-title {
  font-size: 14px;

  color: rgba(255,255,255,0.55);
}

.bp-name {
  font-size: 22px;

  font-weight: 700;

  margin-top: 2px;
}

.bp-unit {
  font-size: 11px;

  color: rgba(255,255,255,0.35);

  margin-top: 1px;
}


/* SYS/DIA 数字输入 */

.bp-box input {
  width: 100%;

  margin-top: 9px;

  padding: 8px;

  border-radius: 11px;

  background: rgba(255,255,255,0.07);

  text-align: center;

  font-size: 29px;

  font-weight: 700;
}


/* 去掉 number 输入框箭头 */

.bp-box input::-webkit-outer-spin-button,
.bp-box input::-webkit-inner-spin-button {
  -webkit-appearance: none;

  margin: 0;
}

.bp-box input[type=number] {
  -moz-appearance: textfield;
}


/* SYS */

.sys {
  color: #ff9f0a;
}


/* DIA */

.dia {
  color: #64d2ff;
}


/* ==========================
   按钮
========================== */

button.main {
  width: 100%;

  padding: 13px;

  margin-top: 14px;

  border-radius: 13px;

  border: none;

  background: #0a84ff;

  color: white;

  font-size: 16px;

  font-weight: 600;

  cursor: pointer;
}

button.main:active {
  opacity: 0.72;

  transform: scale(0.99);
}

.export-btn {
  background: #30d158 !important;
}


/* ==========================
   错误
========================== */

.error {
  color: #ff453a;

  font-size: 14px;

  margin-top: 10px;

  text-align: center;

  display: none;
}


/* ==========================
   历史记录标题
========================== */

.section-title {
  font-size: 14px;

  color: rgba(255,255,255,0.48);

  margin: 4px 3px 10px 3px;
}


/* ==========================
   历史记录
========================== */

.record {
  padding: 14px;

  border-radius: 16px;

  margin-bottom: 10px;

  display: flex;

  justify-content: space-between;

  align-items: center;

  cursor: pointer;

  border: 1px solid rgba(255,255,255,0.055);
}


/* 未导出 */

.record.new {
  background: rgba(255,69,58,0.14);
}


/* 已导出 */

.record.exported {
  background: rgba(48,209,88,0.12);
}


.record-date {
  font-size: 15px;

  font-weight: 600;
}

.record-time {
  font-size: 12px;

  color: rgba(255,255,255,0.5);

  margin-top: 4px;
}

.record-bp {
  text-align: right;
}

.record-value {
  font-size: 25px;

  font-weight: 700;
}

.record-unit {
  font-size: 10px;

  color: rgba(255,255,255,0.38);

  margin-top: 2px;
}


/* ==========================
   空状态
========================== */

.empty {
  text-align: center;

  padding: 30px;

  color: rgba(255,255,255,0.38);
}


/* ==========================
   手机小屏幕
========================== */

@media (max-width: 380px) {

  body {
    padding: 14px;
  }

  #date {
    width: 140px;

    height: 36px;
  }

  .bp-name {
    font-size: 20px;
  }

  .bp-box input {
    font-size: 26px;
  }

}

</style>
</head>


<body>

<div class="container">

<h2>❤️ 血压记录</h2>


<div class="card">


  <!-- 日期 -->

  <div class="date-area">

    <input
      type="date"
      id="date"
    >

  </div>



  <!-- SYS / DIA -->

  <div class="bp-inputs">


    <div class="bp-box">

      <div class="bp-title">
        收缩压
      </div>

      <div class="bp-name sys">
        SYS
      </div>

      <div class="bp-unit">
        mmHg
      </div>

      <input
        type="number"
        id="sys"
        inputmode="numeric"
        placeholder="120"
        min="50"
        max="250"
      >

    </div>



    <div class="bp-box">

      <div class="bp-title">
        舒张压
      </div>

      <div class="bp-name dia">
        DIA
      </div>

      <div class="bp-unit">
        mmHg
      </div>

      <input
        type="number"
        id="dia"
        inputmode="numeric"
        placeholder="80"
        min="30"
        max="180"
      >

    </div>


  </div>



  <div
    id="errorMsg"
    class="error">
  </div>



  <button
    id="addButton"
    class="main"
    onclick="addRecord()"
  >

    添加血压记录

  </button>


</div>



<!-- Excel -->

<div class="card">

  <button
    class="main export-btn"
    onclick="exportExcel()"
  >

    导出新的记录到 Excel

  </button>

</div>



<div class="section-title">
  历史记录
</div>


<div id="list"></div>


</div>



<script>


// ======================================================
// 数据
// ======================================================

let editingId = null;


let records = JSON.parse(

  localStorage.getItem(
    "bloodPressureRecords"
  ) || "[]"

);



// ======================================================
// 当前日期
// ======================================================

function getCurrentDate() {

  const now = new Date();


  const year =
    now.getFullYear();


  const month =
    String(
      now.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      now.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );

}



// ======================================================
// 当前时间
// ======================================================

function getCurrentTime() {

  const now = new Date();


  const hours =
    String(
      now.getHours()
    ).padStart(
      2,
      "0"
    );


  const minutes =
    String(
      now.getMinutes()
    ).padStart(
      2,
      "0"
    );


  return (
    hours +
    ":" +
    minutes
  );

}



// ======================================================
// 设置今天日期
// ======================================================

function setCurrentDate() {

  document
    .getElementById("date")
    .value =
    getCurrentDate();

}


setCurrentDate();



// ======================================================
// 添加 / 修改
// ======================================================

function addRecord() {


  const date =
    document
      .getElementById("date")
      .value;


  const sys =
    parseInt(
      document
        .getElementById("sys")
        .value
    );


  const dia =
    parseInt(
      document
        .getElementById("dia")
        .value
    );


  const error =
    document
      .getElementById("errorMsg");


  error.style.display =
    "none";



  if (!date) {

    showError(
      "请选择日期"
    );

    return;
  }



  if (
    Number.isNaN(sys)
  ) {

    showError(
      "请输入 SYS 收缩压"
    );

    return;
  }



  if (
    Number.isNaN(dia)
  ) {

    showError(
      "请输入 DIA 舒张压"
    );

    return;
  }



  if (
    sys < 50 ||
    sys > 250
  ) {

    showError(
      "SYS 数值似乎不正确，请检查"
    );

    return;
  }



  if (
    dia < 30 ||
    dia > 180
  ) {

    showError(
      "DIA 数值似乎不正确，请检查"
    );

    return;
  }



  if (
    dia >= sys
  ) {

    showError(
      "DIA 应低于 SYS，请检查输入"
    );

    return;
  }



  // ==============================
  // 编辑
  // ==============================

  if (
    editingId !== null
  ) {


    const record =
      records.find(
        r =>
          r.id === editingId
      );


    if (record) {

      record.date =
        date;

      record.sys =
        sys;

      record.dia =
        dia;


      // 编辑后重新变成未导出

      record.exported =
        false;

    }


    editingId =
      null;


    document
      .getElementById(
        "addButton"
      )
      .innerText =
      "添加血压记录";

  }


  // ==============================
  // 新增
  // ==============================

  else {


    const time =
      getCurrentTime();


    records.push({

      id:
        Date.now(),

      date:
        date,

      time:
        time,

      sys:
        sys,

      dia:
        dia,

      exported:
        false

    });

  }



  save();

  render();

  clearInput();

}



// ======================================================
// 错误提示
// ======================================================

function showError(message) {

  const error =
    document
      .getElementById(
        "errorMsg"
      );


  error.innerText =
    message;


  error.style.display =
    "block";

}



// ======================================================
// 清空输入
// ======================================================

function clearInput() {


  document
    .getElementById("sys")
    .value =
    "";


  document
    .getElementById("dia")
    .value =
    "";


  setCurrentDate();


  document
    .getElementById("sys")
    .focus();

}



// ======================================================
// 保存
// ======================================================

function save() {

  localStorage.setItem(

    "bloodPressureRecords",

    JSON.stringify(
      records
    )

  );

}



// ======================================================
// 历史记录
// ======================================================

function render() {


  const list =
    document
      .getElementById(
        "list"
      );


  list.innerHTML =
    "";



  if (
    records.length === 0
  ) {

    list.innerHTML = `

      <div class="card empty">

        还没有血压记录

      </div>

    `;

    return;

  }



  const sortedRecords =

    records
      .slice()
      .sort(
        (a, b) => {


          const aTime =
            new Date(
              `${a.date}T${a.time || "00:00"}`
            );


          const bTime =
            new Date(
              `${b.date}T${b.time || "00:00"}`
            );


          return (
            bTime -
            aTime
          );

        }
      );



  sortedRecords.forEach(
    r => {


      const div =
        document
          .createElement(
            "div"
          );


      div.className =
        "record " +
        (
          r.exported
            ?
            "exported"
            :
            "new"
        );



      div.innerHTML = `


        <div>


          <div class="record-date">

            ${formatDate(r.date)}

          </div>


          <div class="record-time">

            ${r.time || "--:--"}

            ${
              r.exported
                ?
                " · 已导出"
                :
                " · 未导出"
            }

          </div>


        </div>



        <div class="record-bp">


          <div class="record-value">

            <span class="sys">
              ${r.sys}
            </span>

            /

            <span class="dia">
              ${r.dia}
            </span>

          </div>


          <div class="record-unit">

            SYS / DIA mmHg

          </div>


        </div>


      `;



      div.onclick =
        function () {


          const edit =
            confirm(

              `${r.date} ${r.time || ""}\n` +

              `SYS ${r.sys} / DIA ${r.dia}\n\n` +

              `确定 = 编辑\n` +

              `取消 = 删除选项`

            );



          if (edit) {

            editRecord(r);

          }


          else {


            const deleteConfirm =
              confirm(
                "确定删除这条血压记录吗？"
              );


            if (
              deleteConfirm
            ) {


              records =
                records.filter(

                  x =>
                    x.id !== r.id

                );


              save();

              render();

            }

          }

        };



      list.appendChild(
        div
      );


    }
  );

}



// ======================================================
// 编辑
// ======================================================

function editRecord(record) {


  editingId =
    record.id;


  document
    .getElementById("date")
    .value =
    record.date;


  document
    .getElementById("sys")
    .value =
    record.sys;


  document
    .getElementById("dia")
    .value =
    record.dia;


  document
    .getElementById(
      "addButton"
    )
    .innerText =
    "保存修改";


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}



// ======================================================
// 日期格式
// ======================================================

function formatDate(
  dateString
) {


  const parts =
    dateString.split("-");


  return (

    parts[0] +

    "年" +

    parseInt(
      parts[1]
    ) +

    "月" +

    parseInt(
      parts[2]
    ) +

    "日"

  );

}



// ======================================================
// Excel
// ======================================================

function exportExcel() {


  const newRecords =
    records.filter(
      r =>
        !r.exported
    );



  if (
    newRecords.length === 0
  ) {

    alert(
      "没有新的血压记录需要导出"
    );

    return;
  }



  newRecords.sort(
    (a, b) => {


      const da =
        new Date(
          `${a.date}T${a.time || "00:00"}`
        );


      const db =
        new Date(
          `${b.date}T${b.time || "00:00"}`
        );


      return (
        da -
        db
      );

    }
  );



  const excelData =

    newRecords.map(
      r => ({

        "日期":
          r.date,

        "时间":
          r.time || "",

        "SYS 收缩压":
          r.sys,

        "DIA 舒张压":
          r.dia

      })
    );



  const worksheet =

    XLSX.utils.json_to_sheet(
      excelData
    );



  worksheet["!cols"] = [

    {
      wch: 14
    },

    {
      wch: 10
    },

    {
      wch: 15
    },

    {
      wch: 15
    }

  ];



  const workbook =

    XLSX.utils.book_new();



  XLSX.utils.book_append_sheet(

    workbook,

    worksheet,

    "血压记录"

  );



  const filename =

    "血压记录_" +

    getCurrentDate() +

    ".xlsx";



  XLSX.writeFile(

    workbook,

    filename

  );



  newRecords.forEach(
    r => {


      const original =
        records.find(

          x =>
            x.id === r.id

        );


      if (original) {

        original.exported =
          true;

      }

    }
  );



  save();

  render();

}



// ======================================================
// Enter 操作
// ======================================================

document
  .getElementById("sys")
  .addEventListener(

    "keydown",

    function(e) {


      if (
        e.key === "Enter"
      ) {

        document
          .getElementById("dia")
          .focus();

      }

    }

  );



document
  .getElementById("dia")
  .addEventListener(

    "keydown",

    function(e) {


      if (
        e.key === "Enter"
      ) {

        addRecord();

      }

    }

  );



// ======================================================
// 初始化
// ======================================================

render();


</script>

</body>
</html>
